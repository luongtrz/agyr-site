        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Unlike proxy routers (which route traffic through custom servers with forged headers and cloud IPs), agyr is a local authentication swapper. It runs Google's official agy binary directly on your machine. To Google's servers, it looks identical to logging in and out of different accounts manually."
        }
      },
      {
        "@type": "Question",
        "name": "How does agy-run maintain conversation context after hitting a 429?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "When a 429 quota exhaustion is detected, agy-run terminates the session, marks that slot on cooldown, switches the active token file to the best available account, and launches agy --conversation <existing-conversation-id>. Because Antigravity's conversation history is stored on disk or server session, the new account resumes the same context without re-reading files."
        }
      },
      {
        "@type": "Question",
        "name": "What happens if all my saved accounts run out of quota simultaneously?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "If the entire account pool is on cooldown, agyr and agy-run exit with code 5 (or code 3 for interactive rotate) and display the earliest reset time in your local timezone (e.g. \"all accounts on cooldown, earliest reset in 48m at 05:15 PM\"). It does not loop or burn tokens."
        }
      },
      {
        "@type": "Question",
        "name": "Does agyr work with Claude Code or Gemini CLI agents?",
        "acceptedAnswer": {

          "text": "Yes. The repository ships with skills/agy/, which lets Claude Code, Antigravity, and Gemini act as orchestrators and reviewers while delegating repetitive coding tasks to agy-task in isolated git worktrees."
